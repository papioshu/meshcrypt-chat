# Gradle settings for F-Droid release builds

# Enable Gradle build optimizations for faster builds
org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Enable build cache to speed up subsequent builds
org.gradle.caching=true

# Parallel compilation for faster builds
org.gradle.parallel=true

# Enable configuration cache (experimental but can speed up builds significantly)
org.gradle.configuration-cache=true

# Flutter SDK path (will be set during Flutter build setup)
flutter.sdk=/path/to/flutter

# Enable R8 full mode for better code shrinking
android.enableR8.fullMode=true

# Android build configuration
android.useAndroidX=true
android.enableJetifier=true

# Release build optimizations
android.enableMinify=true
android.enableShrinkResources=true

# F-Droid specific optimizations
android.releaseMinifyEnabled=true
android.releaseShrinkResources=true

# ProGuard and R8 settings for Flutter
android.enableProguardInReleaseBuilds=true
android.enableR8InReleaseBuilds=true